name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Calculate version and release notes
        id: version
        shell: bash
        run: |
          version="$(python scripts/release_version.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python scripts/release_version.py notes > release-notes.md

      - name: Save release notes
        uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer and portable executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name VoltForge --icon "assets\icons\voltforge.ico" --add-data "assets\icons;assets\icons" main.py
          Set-Content -Path "dist\VoltForge\VERSION.txt" -Value "${{ needs.prepare.outputs.version }}"

          $version = "${{ needs.prepare.outputs.version }}"
          $installerScript = @'
          [Setup]
          AppId={{87F6C4D1-5E52-4E63-B758-7DEB2C205D2A}
          AppName=VoltForge
          AppVersion=__VERSION__
          AppPublisher=VoltForge contributors
          SetupIconFile=assets\icons\voltforge.ico
          DefaultDirName={autopf}\VoltForge
          DefaultGroupName=VoltForge
          OutputDir=dist\installer
          OutputBaseFilename=VoltForge-__VERSION__-windows-x64-setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\VoltForge.exe

          [Files]
          Source: "dist\VoltForge\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\VoltForge"; Filename: "{app}\VoltForge.exe"
          Name: "{autodesktop}\VoltForge"; Filename: "{app}\VoltForge.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          '@
          $installerScript = $installerScript.Replace("__VERSION__", $version)
          Set-Content -Path "installer.iss" -Value $installerScript -Encoding ASCII
          New-Item -ItemType Directory -Force -Path "dist\installer" | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iconPath = (Resolve-Path "assets\icons").Path
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name VoltForge-Portable --icon "${iconPath}\voltforge.ico" --distpath "dist\portable" --workpath "build\portable" --specpath "build\portable" --add-data "${iconPath};assets\icons" main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Rename-Item -Path "dist\portable\VoltForge-Portable.exe" -NewName "VoltForge-${version}-windows-x64-portable.exe"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "dist\installer\VoltForge-${version}-windows-x64-setup.exe" "release-assets\"
          Copy-Item "dist\portable\VoltForge-${version}-windows-x64-portable.exe" "release-assets\"

      - name: Upload Windows executables
        uses: actions/upload-artifact@v5
        with:
          name: windows-package
          path: release-assets/*.exe
          if-no-files-found: error

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev librsvg2-bin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux application and packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name VoltForge --add-data "assets/icons:assets/icons" main.py
          printf '%s\n' "$VERSION" > dist/VoltForge/VERSION.txt
          tar -czf "VoltForge-${VERSION}-linux-x64.tar.gz" -C dist VoltForge

          package_root="$RUNNER_TEMP/voltforge-deb"
          install -d "$package_root/DEBIAN"
          install -d "$package_root/opt/voltforge"
          install -d "$package_root/usr/share/applications"
          install -d "$package_root/usr/share/icons/hicolor/scalable/apps"
          cp -a dist/VoltForge/. "$package_root/opt/voltforge/"
          install -m 0644 assets/icons/voltforge.svg \
            "$package_root/usr/share/icons/hicolor/scalable/apps/voltforge.svg"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: voltforge
          Version: ${VERSION#v}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: VoltForge contributors
          Description: Interactive electrical circuit design and simulation
           Desktop application for drawing and simulating electrical circuits.
          EOF
          cat > "$package_root/usr/share/applications/voltforge.desktop" <<'EOF'
          [Desktop Entry]
          Name=VoltForge
          GenericName=Conception et simulation électrique
          Comment=Electrical circuit design and simulation
          Keywords=électricité;circuit;simulation;électronique;VoltForge;
          Exec=/opt/voltforge/VoltForge
          Icon=voltforge
          Terminal=false
          Type=Application
          Categories=Education;Science;Engineering;
          StartupWMClass=VoltForge
          EOF
          dpkg-deb --build --root-owner-group "$package_root" \
            "VoltForge-${VERSION}-linux-amd64.deb"

          appdir="$RUNNER_TEMP/VoltForge.AppDir"
          install -d "$appdir/usr/bin/VoltForge"
          cp -a dist/VoltForge/. "$appdir/usr/bin/VoltForge/"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          exec "$APPDIR/usr/bin/VoltForge/VoltForge" "$@"
          EOF
          chmod 0755 "$appdir/AppRun"
          cat > "$appdir/voltforge.desktop" <<'EOF'
          [Desktop Entry]
          Name=VoltForge
          GenericName=Conception et simulation électrique
          Comment=Electrical circuit design and simulation
          Keywords=électricité;circuit;simulation;électronique;VoltForge;
          Exec=AppRun
          Icon=voltforge
          Terminal=false
          Type=Application
          Categories=Education;Science;Engineering;
          StartupWMClass=VoltForge
          EOF
          install -d "$appdir/usr/share/applications"
          install -d "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp "$appdir/voltforge.desktop" "$appdir/usr/share/applications/voltforge.desktop"
          rsvg-convert -w 256 -h 256 assets/icons/voltforge.svg \
            -o "$appdir/voltforge.png"
          cp "$appdir/voltforge.png" \
            "$appdir/usr/share/icons/hicolor/256x256/apps/voltforge.png"
          ln -s voltforge.png "$appdir/.DirIcon"

          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod 0755 "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" \
            "$appdir" "VoltForge-${VERSION}-linux-x86_64.AppImage"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            VoltForge-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
            VoltForge-${{ needs.prepare.outputs.version }}-linux-amd64.deb
            VoltForge-${{ needs.prepare.outputs.version }}-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          name: windows-package
          path: release-assets

      - name: Download Linux packages
        uses: actions/download-artifact@v5
        with:
          name: linux-packages
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: release-metadata

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release-assets/* --clobber
          else
            gh release create "$VERSION" release-assets/* \
              --target "$TARGET_SHA" \
              --title "VoltForge $VERSION" \
              --notes-file release-metadata/release-notes.md
          fi
